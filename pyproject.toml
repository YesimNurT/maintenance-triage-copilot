[project]
name = "mtc"
version = "0.1.0"
description = "Maintenance Triage Copilot: fleet health ranking, similar-case retrieval and LLM inspection notes on NGAFID flight data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "dask[dataframe]>=2024.1",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Deep learning (installed on Kaggle/Colab or locally when training)
dl = ["torch>=2.2"]
# Agent + retrieval (from F4/F5)
agent = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-google-genai>=2.0",
    "pinecone>=5.0",
    "langsmith>=0.1",
]
# Serving (from F5)
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
app = ["streamlit>=1.33", "requests>=2.31"]
data = ["kaggle>=1.6"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "jupyterlab>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
