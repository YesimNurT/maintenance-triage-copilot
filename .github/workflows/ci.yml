name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      # no torch: the sequence tests skip. Agent, API and UI tests run; Gemini and
      # Pinecone are never called, tests use fakes
      - run: uv sync --group dev --extra agent --extra api --extra app --locked
      - run: uv run ruff check .
      - run: uv run pytest
