name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      # core + dev only: no torch / agent extras, tests mock Gemini and Pinecone
      - run: uv sync --group dev --locked
      - run: uv run ruff check .
      - run: uv run pytest
